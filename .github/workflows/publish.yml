name: NPM Publish

on:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - run: yarn install
      - run: yarn build
      - run: yarn test:ci
      - name: Publish
        run: yarn npm publish --provenance --access public
